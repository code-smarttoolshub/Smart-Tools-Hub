<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Tools Hub</title>
    <style>
        body { font-family: sans-serif; background: #F4F6F9; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 400px; margin: 20px auto; }
        textarea { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>Smart Tools Hub (Test Mode)</h1>
    <p>Hum sirf Word Counter test kar rahe hain:</p>

    <div class="card">
        <h2>Word & Character Counter</h2>
        <textarea id="txt" rows="4" oninput="count()" placeholder="Yahan kuch likhein..."></textarea>
        <p style="font-weight: bold; color: green;">Words: <span id="w">0</span> | Chars: <span id="c">0</span></p>
    </div>

    <script>
        function count() {
            let t = document.getElementById('txt').value.trim();
            document.getElementById('w').innerText = t === "" ? 0 : t.split(/\s+/).length;
            document.getElementById('c').innerText = t.length;
        }
    </script>
</body>
</html>
