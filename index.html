<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tools Hub</title>

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); }
        h1 { color: #333; margin-bottom: 25px; }
        .tool-section { background: #fdfdfd; padding: 20px; margin: 20px 0; border-radius: 12px; border: 1px solid #eee; text-align: left; }
        h2 { color: #444; font-size: 18px; margin-top: 0; }
        textarea, input[type="date"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; margin-bottom: 10px; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; }
        button:hover { background: #0056b3; }
        .result { margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 8px; font-size: 15px; color: #333; word-break: break-all; }
        .label-text { font-size: 14px; color: #666; margin-bottom: 5px; display: block; }<meta name="google-site-verification" content="MEzsEx3KvSn9kgWvKnZ1snIO4Q9sk7oaxHfXOLALnWM" />
    </style>
</head>
<body>

<div class="container">
    <h1>🛠️ Smart Tools Hub</h1>

    <!-- 1. WORD COUNTER -->
    <div class="tool-section">
        <h2>📝 Word & Character Counter</h2>
        <textarea id="textInput" rows="4" placeholder="Type or paste your text here..." oninput="countText()"></textarea>
        <div class="result">
            Words: <span id="wordCount" style="font-weight:bold;">0</span> | Characters: <span id="charCount" style="font-weight:bold;">0</span>
        </div>
    </div>

    <!-- 2. AGE CALCULATOR -->
    <div class="tool-section">
        <h2>🎂 Age Calculator</h2>
        <span class="label-text">Select your Date of Birth:</span>
        <input type="date" id="dobInput">
        <button onclick="calculateAge()">Calculate Age</button>
        <div id="ageResult" class="result" style="display:none;"></div>
    </div>

    <!-- 3. PASSWORD GENERATOR -->
    <div class="tool-section">
        <h2>🔑 Secure Password Generator</h2>
        <span class="label-text">Enter password length (e.g., 8, 12, 16):</span>
        <input type="number" id="passwordLength" value="12" min="4" max="50">
        <button onclick="generatePassword()" style="background: #17a2b8;">Generate Password</button>
        <div id="passwordResult" class="result" style="display:none; font-family:monospace; font-size:16px; letter-spacing:1px;"></div>
    </div>

    <!-- 4. TEXT TO PDF CONVERTER -->
    <div class="tool-section">
        <h2>📄 Text to PDF Converter</h2>
        <textarea id="pdfTextInput" rows="4" placeholder="Type the text here that you want to convert into a PDF file..."></textarea>
        <button onclick="generatePDFFromText()" style="background: #28a745;">Download PDF File</button>
    </div>
</div>

<!-- html2pdf Library -->
<script src="https://cloudflare.com"></script>

<script>
    // Word Counter Logic
    function countText() {
        let text = document.getElementById("textInput").value;
        document.getElementById("charCount").innerText = text.length;
        let words = text.trim().split(/\s+/).filter(w => w.length > 0);
        document.getElementById("wordCount").innerText = words.length;
    }

    // Age Calculator Logic
    function calculateAge() {
        let dob = document.getElementById("dobInput").value;
        if (!dob) { alert("Please select a date first!"); return; }
        let diff = Date.now() - new Date(dob).getTime();
        let ageDate = new Date(diff);
        let years = Math.abs(ageDate.getUTCFullYear() - 1970);
        let resultDiv = document.getElementById("ageResult");
        resultDiv.style.display = "block";
        resultDiv.innerHTML = "Your Age is: <strong>" + years + " Years</strong>!";
    }

    // Password Generator Logic
    function generatePassword() {
        let lengthInput = document.getElementById("passwordLength").value;
        let length = parseInt(lengthInput);
        if (isNaN(length) || length < 4) { alert("Please enter a valid length (minimum 4)!"); return; }
        
        let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
        let pass = "";
        for (let i = 0; i < length; i++) { pass += chars.charAt(Math.floor(Math.random() * chars.length)); }
        let resDiv = document.getElementById("passwordResult");
        resDiv.style.display = "block";
        resDiv.innerText = pass;
    }
// Naya Stable PDF Function
function generatePDFFromText() {
    var text = document.getElementById('pdfTextInput').value;
    if (!text.trim()) { alert('Please write some text in the box first!'); return; }
    
    var printWindow = window.open('', '', 'height=500,width=800');
    printWindow.document.write('<html><head><title>Smart Tools Hub PDF</title>');
    printWindow.document.write('<style>body{font-family:Arial; padding:30px; line-height:1.6; white-space:pre-wrap;}</style>');
    printWindow.document.write('</head><body>');
    printWindow.document.write(text);
    printWindow.document.write('</body></html>');
    printWindow.document.close();
    
    // Auto trigger PDF save dialog
    printWindow.print();
}
