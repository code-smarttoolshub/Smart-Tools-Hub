<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-92R9DFFF9');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tools Hub</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        /* Main Container */
        .container {
            background: white; 
            padding: 30px; 
            max-width: 600px; 
            margin: auto; 
            border-radius: 10px; 
            box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
        }
        h1, h2 { text-align: center; color: #333; }
        textarea, input[type="date"] { 
            width: 100%; 
            border-radius: 5px; 
            border: 1px solid #ccc; 
            padding: 12px; 
            font-size: 16px; 
            box-sizing: border-box;
            margin-top: 10px;
        }
        textarea { height: 150px; }
        .calc-btn {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .calc-btn:hover { background: #0056b3; }
        .result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; }
        .tool-section { display: none; }
        .tool-section.active { display: block; }
        
        /* Ad Slots for Earning */
        .ad-space {
            margin: 20px auto;
            max-width: 600px;
            padding: 15px;
            background: #ebebeb;
            border: 1px dashed #999;
            text-align: center;
            font-size: 12px;
            color: #666;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Smart Tools Hub</h1>

    <!-- TOP ADVERTISEMENT SLOT -->
    <div class="ad-space">--- Google AdSense Banner (Top) ---</div>

    <!-- Navigation Menu -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTool('word-counter')">📝 Word Counter</button>
        <button class="tab-btn" onclick="switchTool('age-calculator')">🗓️ Age Calculator</button>
    </div>

    <div class="container">
        
        <!-- SECTION 1: WORD COUNTER -->
        <div id="word-counter" class="tool-section active">
            <h2>Free Word & Character Counter</h2>
            <p>Type or paste your text below:</p>
            <textarea id="textInput" placeholder="Start typing here..." oninput="countWords()"></textarea>
            <div class="result">
                Words: <span id="wordCount">0</span> | Characters: <span id="charCount">0</span>
            </div>
        </div>

        <!-- SECTION 2: AGE CALCULATOR -->
        <div id="age-calculator" class="tool-section">
            <h2>Exact Age Calculator</h2>
            <p>Select your Date of Birth:</p>
            <input type="date" id="dobInput">
            <button class="calc-btn" onclick="calculateAge()">Calculate Age</button>
            <div class="result" id="ageResult" style="display:none; font-weight: normal; line-height: 1.6;">
                <p><strong>Your Exact Age:</strong></p>
                <p id="exactAgeTxt"></p>
                <p id="totalDaysTxt" style="color: #666; font-size: 15px;"></p>
            </div>
        </div>

    </div>

    <!-- BOTTOM ADVERTISEMENT SLOT -->
    <div class="ad-space">--- Google AdSense Banner (Bottom) ---</div>

    <script>
        // Tab Switching Logic
        function switchTool(toolId) {
            document.querySelectorAll('.tool-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(toolId).classList.add('active');
            event.target.classList.add('active');
        }

        // Word Counter Logic
        function countWords() {
            let text = document.getElementById("textInput").value;
            document.getElementById("charCount").innerText = text.length;
            
            let words = text.trim().split(/\s+/);
            document.getElementById("wordCount").innerText = text.trim() === "" ? 0 : words.length;
        }

        // Age Calculator Logic
        function calculateAge() {
            let dobValue = document.getElementById('dobInput').value;
            if (!dobValue) { alert('Please select a date!'); return; }
            
            let dob = new Date(dobValue);
            let today = new Date();
            if (dob > today) { alert('Date cannot be in the future!'); return; }
            
            let years = today.getFullYear() - dob.getFullYear();
            let months = today.getMonth() - dob.getMonth();
            let days = today.getDate() - dob.getDate();
            
            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) { years--; months += 12; }
            
            let totalDays = Math.floor((today - dob) / (1000 * 60 * 60 * 24));
            
            document.getElementById('exactAgeTxt').innerHTML = `⏱️ ${years} Years, ${months} Months, and ${days} Days`;
            document.getElementById('totalDaysTxt').innerHTML = `📅 Total Days Passed: ${totalDays.toLocaleString()} days`;
            document.getElementById('ageResult').style.display = 'block';
        }
    </script>
</body>
</html>
